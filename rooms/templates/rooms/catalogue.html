<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room catalogue</title>
</head>
<body>
    <main>
        <h1>Room catalogue</h1>
        <<ul>
    {% for room in rooms %}
        <li>
            {{ room.code }} — {{ room.name }} — {{ room.capacity }} places — {{ room.location.city }}
        </li>
    {% empty %}
        <li>Aucune salle disponible.</li>
    {% endfor %}
</ul>>
    </main>
</body>
</html>
